<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visor de grafo</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body class="viewer-page">
  <header class="viewer-header">
    <a href="index.html" class="back">← Índice</a>
    <h1 id="graph-title">Grafo</h1>
    <p id="graph-stats"></p>
    <div class="viewer-controls">
      <label class="control-block">
        Grado mínimo (≥)
        <div class="control-row">
          <input type="range" id="degree-slider" min="0" max="100" value="0" />
          <input type="number" id="degree-input" class="num-input" min="0" max="100" value="0" />
        </div>
      </label>
      <label class="control-block">
        Peso arista mín.
        <div class="control-row">
          <input type="range" id="weight-slider" min="1" max="10" value="1" />
          <input type="number" id="weight-input" class="num-input" min="1" max="10" value="1" />
        </div>
      </label>
      <label class="control-block">
        Tamaño de nodos
        <select id="size-select">
          <option value="degree">Grado</option>
          <option value="post_count">Nº posts</option>
          <option value="uniform">Uniforme</option>
        </select>
      </label>
      <label class="control-block">
        Layout
        <select id="layout-select">
          <option value="forceAtlas2Based">Force Atlas 2</option>
          <option value="barnesHut">Barnes-Hut</option>
          <option value="repulsion">Repulsión</option>
          <option value="hierarchicalRepulsion">Jerárquico</option>
        </select>
      </label>
      <label class="control-inline"><input type="checkbox" id="labels-toggle" checked /> Etiquetas</label>
      <label class="control-inline"><input type="checkbox" id="physics-toggle" checked /> Física</label>
      <button type="button" id="export-png-btn" class="secondary">Exportar PNG</button>
      <button type="button" id="relayout-btn">Re-layout</button>
      <button type="button" id="fit-btn">Centrar</button>
      <button type="button" id="reset-btn">Restablecer</button>
    </div>
    <p id="filter-hint" class="filter-hint"></p>
  </header>
  <div class="viewer-body">
    <div id="network"></div>
    <aside id="cluster-legend" class="cluster-legend" aria-label="Leyenda de comunidades">
      <h2>Comunidades</h2>
      <p id="legend-hint" class="legend-hint">Clic: mostrar/ocultar · doble clic: renombrar</p>
      <div class="legend-actions">
        <button type="button" id="legend-show-all" class="legend-action">Mostrar todas</button>
        <button type="button" id="legend-hide-all" class="legend-action">Ocultar todas</button>
      </div>
      <ul id="legend-list"></ul>
    </aside>
  </div>
  <script src="assets/viewer.js?v=5"></script>
</body>
</html>
