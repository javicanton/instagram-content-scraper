<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visor de grafo</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body class="viewer-page">
  <header class="viewer-header">
    <a href="index.html" class="back">← Índice</a>
    <h1 id="graph-title">Grafo</h1>
    <p id="graph-stats"></p>
    <div class="viewer-controls">
      <label class="control-block">
        Grado mínimo (≥)
        <input type="range" id="degree-slider" min="0" max="100" value="0" />
        <span id="degree-value">0</span>
      </label>
      <label class="control-block">
        Peso arista mín.
        <input type="range" id="weight-slider" min="1" max="10" value="1" />
        <span id="weight-value">1</span>
      </label>
      <label class="control-inline"><input type="checkbox" id="labels-toggle" checked /> Etiquetas</label>
      <label class="control-inline"><input type="checkbox" id="physics-toggle" checked /> Física</label>
      <button type="button" id="fit-btn">Centrar</button>
      <button type="button" id="reset-btn">Restablecer</button>
    </div>
    <p id="filter-hint" class="filter-hint"></p>
  </header>
  <div id="network"></div>
  <script src="assets/viewer.js"></script>
</body>
</html>
